[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-ct"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
  "torch", "torchvision", "numpy", "pandas", "scikit-learn", "pydicom",
  "opencv-python", "matplotlib", "tqdm", "joblib>=1.3", "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
