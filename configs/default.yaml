seed: 42

paths:
  data_root: "data/Brain_Stroke_CT_Dataset"     # relative paths below are resolved against this
  output_dir: "outputs"
  folders:
    Bleeding: "Bleeding/DICOM"
    Ischemia: "Ischemia/DICOM"
    Normal: "Normal/DICOM"
  external_test_dicom_dir: "External_Test/DICOM"
  external_test_labels_csv: "External_Test/labels Copy.csv"

data:
  class_labels: {Bleeding: 1, Ischemia: 0, Normal: 0}
  valid_exts: [".dcm", ".dicom", ""]
  img_size: 256
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

cache:
  prefix: "planes_cache"    # folder = <output_dir>/<prefix>_<fingerprint of all preprocessing params>
  version: "p32"            # bump by hand only if you change the CODE of the pipeline

preprocessing:
  # skull strip
  bone_hu_threshold: 100
  pocket_hu_low: 0
  pocket_hu_high: 100
  min_pocket_area: 60
  # border erosion
  border_erode_mm: 1
  border_smooth_sigma: 2.0
  # bbox + adaptive binarization (HU high edge fixed, HU low edge adaptive)
  tissue_hu_threshold: 5
  hu_low_start: 40
  hu_high_fixed: 100
  hu_step: 7
  white_pct_target: 18.0
  min_white_pct_floor: 16.0
  fine_step: 1
  hu_low_cap: 70
  hu_low_min: 40
  salt_pepper_kernel_size: 3             # on the guide mask AFTER binarization
  pre_bbox_salt_pepper_kernel_size: 3    # on the tissue BEFORE the bbox
  # extended neighbourhood
  extend_pixels: 4
  hu_extend_margin: 100.0
  neighbour_hu_low: 0
  neighbour_hu_high: 100
  # grey-region cleanup
  grey_region_hu_cutoff: 100
  # how the full-resolution masks are shrunk to img_size
  mask_interp: nearest

# Cache planes: 0 raw, 1 clean, 2 guide (binary), 3 ext (HU in dilated region), 4 guide_hu (HU in binarised region)
channels:
  t1: [1, 1, 1]        # clean, clean, clean   (control)
  t2: [1, 4, 3]        # clean, guide_hu, ext  (default)
  t2clean: [1, 2, 3]   # clean, guide (binary), ext

training:
  channels: t2
  backbone: resnet18          # resnet18 | resnet34 | resnet50
  pretrained: true
  n_per_class_pool: 500
  folds: 5
  epochs: 50
  patience: 10
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  warm_cache: true            # preprocess all scans in parallel before training
  warm_jobs: 4
  exclude_by_filename: false  # true = build the test set by filename only (old behaviour)
  decision_threshold: 0.5     # fixed threshold for the headline numbers
  device: null                # null = auto (cuda if available)
  tag: ""                     # optional suffix for run names

threshold_tune:
  threshold: null             # null = use the best fold's validation (Youden) threshold from the run
  sweep_start: 0.05
  sweep_end: 0.96
  sweep_step: 0.05
  probs_path: null
  plot: true

outputs:
  split_csv: "{name}_split.csv"
  folds_csv: "{name}_folds_val.csv"
  fold_model: "{name}_best_fold{fold}.pt"
  test_csv: "{name}_test_bestfold.csv"
  test_probs_npz: "{name}_test_probs_labels.npz"
  sweep_csv: "{name}_threshold_sweep.csv"
  sweep_plot: "{name}_threshold_sweep.png"
